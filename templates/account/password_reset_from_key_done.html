{% extends "base.html" %}
{% load static %}

{% block title %}مُهاجر | تم تغيير كلمة المرور{% endblock %}

{% block content %}
<style>
    .auth-page-wrapper {
        min-height: 70vh;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 50px 5%;
        font-family: var(--font-body);
        direction: rtl;
        position: relative;
    }
    .bg-watermark {
        display: none !important;
    }

    .auth-container {
        width: 100%;
        max-width: 480px;
        background: rgba(10, 10, 8, 0.6);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 50px 40px;
        box-shadow: 0 0 40px rgba(201, 167, 92, 0.1), inset 0 0 20px rgba(201, 167, 92, 0.05);
        border: 1px solid rgba(201, 167, 92, 0.3);
        text-align: center;
        margin-bottom: 50px;
        position: relative;
        z-index: 10;
    }

    .auth-title {
        color: var(--gold);
        font-family: var(--font-heading);
        font-size: 2.2rem;
        margin-bottom: 5px;
    }

    .title-separator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-bottom: 35px;
    }
    .title-separator span {
        height: 1px;
        width: 40px;
        background: rgba(212, 175, 55, 0.3);
    }
    .title-separator i { color: var(--gold); font-size: 0.7rem; opacity: 0.8; }

    .submit-btn {
        width: 100%;
        background: linear-gradient(135deg, #d4af37, #aa8529);
        color: #111;
        border: none;
        border-radius: 8px;
        padding: 14px;
        font-size: 1.2rem;
        font-weight: bold;
        font-family: var(--font-body);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        transition: 0.3s ease;
        text-decoration: none;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }

</style>

<div class="auth-page-wrapper">
    <div class="auth-container">
        <i class="fas fa-check-circle" style="font-size: 3.5rem; color: #28a745; margin-bottom: 15px;"></i>
        <h1 class="auth-title">تم بنجاح!</h1>
        
        <div class="title-separator">
            <span></span>
            <i class="fas fa-star" style="font-size: 0.6rem; color: var(--gold);"></i>
            <span></span>
        </div>

        <p style="color: rgba(255, 255, 255, 0.8); font-size: 1rem; line-height: 1.6; margin-bottom: 30px;">
            تم تغيير كلمة المرور الخاصة بك بنجاح. يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.
        </p>

        <a href="{% url 'account_login' %}" class="submit-btn">
            تسجيل الدخول <i class="fas fa-sign-in-alt" style="transform: scaleX(-1);"></i>
        </a>
    </div>
</div>
{% endblock %}
