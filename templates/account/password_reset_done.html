{% extends "base.html" %}

{% block title %}مُهاجر | تم إرسال الرابط{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 100px auto; padding: 40px; background-color: var(--bg-surface); border-radius: 15px; border: 1px solid #333; text-align: center; color: #fff;">
    <i class="fas fa-envelope-open-text" style="font-size: 4rem; color: var(--gold); margin-bottom: 20px;"></i>
    <h2 style="color: var(--gold); font-family: var(--font-heading); margin-bottom: 15px;">تم إرسال البريد بنجاح!</h2>
    <p style="color: #aaa; line-height: 1.6; margin-bottom: 30px;">
        لقد أرسلنا تعليمات إعادة تعيين كلمة المرور إلى بريدك الإلكتروني. <br>
        يرجى التحقق من صندوق الوارد و اتباع الرابط.
    </p>
    <a href="/" style="display: inline-block; background-color: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 10px 25px; border-radius: 5px; text-decoration: none; font-weight: bold;">
        العودة للرئيسية
    </a>
</div>
{% endblock %}
