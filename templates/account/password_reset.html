{% extends "base.html" %}

{% block title %}مُهاجر | استعادة كلمة المرور{% endblock %}

{% block content %}
<style>
    .reset-container {
        max-width: 500px;
        margin: 80px auto;
        padding: 30px;
        background-color: var(--bg-surface);
        border-radius: 15px;
        border: 1px solid #333;
        text-align: center;
        color: #fff;
    }
    .reset-form input {
        width: 100%; padding: 12px; margin-bottom: 20px; 
        background: #222; border: 1px solid #444; color: #fff; 
        border-radius: 5px; font-family: var(--font-body);
    }
    .reset-form label {
        display: block; text-align: right; margin-bottom: 8px; color: var(--gold);
    }
    .reset-form ul { list-style: none; padding: 0; color: red; text-align: right; font-size: 0.9rem;}
</style>

<div class="reset-container">
    <i class="fas fa-lock" style="font-size: 3rem; color: var(--gold); margin-bottom: 20px;"></i>
    <h2 style="color: var(--gold); font-family: var(--font-heading); margin-bottom: 10px;">نسيت كلمة المرور؟</h2>
    <p style="color: #aaa; margin-bottom: 30px;">أدخل بريدك الإلكتروني المسجل لدينا وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.</p>
    
    <form method="POST" action="{% url 'account_reset_password' %}" class="reset-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; background-color: var(--gold); color: var(--bg-base); padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: var(--font-body); font-size: 1.1rem; transition: 0.3s;">
            إرسال رابط الاستعادة
        </button>
    </form>
</div>
{% endblock %}
