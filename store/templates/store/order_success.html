{% extends 'base.html' %}
{% load static %}

{% block title %} مُهاجر | تم تأكيد الطلب {% endblock %}

{% block content %}
<div style="padding: 100px 5%; direction: rtl; text-align: center; min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    
    <div style="background: var(--bg-surface); padding: 50px; border-radius: 20px; border: 1px solid var(--gold); box-shadow: 0 10px 40px rgba(200, 169, 110, 0.1); max-width: 600px; width: 100%;">
        
        <!-- علامة الصح الذهبية -->
        <div style="width: 100px; height: 100px; background: rgba(200, 169, 110, 0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 30px;">
            <i class="fas fa-check" style="font-size: 3.5rem; color: var(--gold);"></i>
        </div>

        <h1 style="font-family: var(--font-heading); color: var(--cream); font-size: 2.8rem; margin-bottom: 15px;">تم استلام طلبك بنجاح!</h1>
        
        <p style="color: var(--sand); font-family: var(--font-body); font-size: 1.2rem; line-height: 1.8; margin-bottom: 40px;">
            شكراً لتسوقك من مُهاجر. لقد قمنا باستلام طلبك وسنقوم بالتواصل معك قريباً لتأكيد تفاصيل الشحن.
        </p>

        <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'shop' %}" style="background-color: var(--gold); color: var(--bg-base); padding: 15px 40px; border-radius: 10px; text-decoration: none; font-weight: bold; font-family: var(--font-body); font-size: 1.2rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(200, 169, 110, 0.3);">
                متابعة التسوق
            </a>
            <a href="{% url 'index' %}" style="background-color: transparent; border: 2px solid var(--umber); color: var(--cream); padding: 15px 40px; border-radius: 10px; text-decoration: none; font-weight: bold; font-family: var(--font-body); font-size: 1.2rem; transition: 0.3s;">
                الرئيسية
            </a>
        </div>
        
    </div>
</div>
{% endblock %}
