{% extends 'base.html' %}
{% load static %}

{% block title %} تم الطلب بنجاح | مُهاجر {% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; direction: rtl;">
    <div style="background: var(--bg-surface); padding: 50px 40px; border-radius: 20px; border: 1px solid var(--gold); text-align: center; max-width: 600px; box-shadow: 0 10px 30px rgba(200, 169, 110, 0.15);">
        
        <!-- أيقونة الصح -->
        <div style="width: 90px; height: 90px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; box-shadow: 0 0 20px rgba(200, 169, 110, 0.4);">
            <i class="fas fa-check" style="font-size: 45px; color: var(--bg-base);"></i>
        </div>
        
        <!-- رسالة التأكيد -->
        <!-- رسالة التأكيد (بالخط التراثي الفخم) -->
        <h1 style="font-family: 'Aref Ruqaa', serif; color: var(--gold); font-size: 3rem; margin-bottom: 15px; font-weight: normal;">تم استلام طلبك بنجاح!</h1>
        
        <!-- الشرح (بخط كايرو الواضح والمريح للعين) -->
        <p style="color: var(--cream); font-family: 'Cairo', sans-serif; font-size: 1.3rem; line-height: 1.8; margin-bottom: 40px; font-weight: 400;">
            شكراً لاختيارك <strong style="color: var(--gold); font-family: 'Aref Ruqaa', serif; font-size: 1.5rem; font-weight: normal;">مُهاجر</strong>.<br>
            لقد تم تسجيل طلبك بأمان، وسنقوم بالتواصل معك قريباً لتأكيد تفاصيل الشحن.
        </p>
        
        <!-- زرار العودة (بخط كايرو عشان يكون واضح وحاد) -->
        <a href="{% url 'index' %}" style="display: inline-block; background-color: transparent; border: 2px solid var(--gold); color: var(--gold); padding: 12px 35px; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 1.2rem; font-family: 'Cairo', sans-serif; transition: 0.3s;" onmouseover="this.style.backgroundColor='var(--gold)'; this.style.color='var(--bg-base)';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='var(--gold)';">
            العودة للتسوق
        </a>
        
    </div>
</div>
{% endblock %}
